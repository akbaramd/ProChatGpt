<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    body { width: 260px; margin: 0; padding: 14px 14px 16px;
      font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    p.sub { margin: 0 0 12px; color: #777; font-size: 11.5px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; }
    label { font-weight: 600; }
    input[type="text"], input[type="number"] {
      width: 100%; box-sizing: border-box; padding: 7px 9px; font: inherit;
      border: 1px solid #ccc; border-radius: 8px; background: Field; color: FieldText; }
    input[type="number"] { width: 70px; }
    .field { margin: 10px 0; }
    .field label { display: block; margin-bottom: 5px; }
    .switch { position: relative; display: inline-block; width: 42px; height: 24px; flex: 0 0 auto; cursor: pointer; }
    .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; z-index: 2; cursor: pointer; }
    .slider { position: absolute; inset: 0; background: #bbb; border-radius: 999px; transition: .15s; pointer-events: none; }
    .slider::before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: .15s; }
    .switch input:checked + .slider { background: #10a37f; }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .switch input:focus-visible + .slider { outline: 2px solid #94baff; outline-offset: 3px; }
    .hint { color: #888; font-size: 11px; margin-top: 4px; }
    .saved { color: #10a37f; font-size: 11.5px; height: 14px; margin-top: 8px; }
    .activity { margin-top: 10px; border-top: 1px solid #ddd; padding-top: 8px; }
    .activity summary { cursor: pointer; font-weight: 600; font-size: 12.5px; }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin: 8px 0; font-size: 11.5px; }
    .metrics span { color: #777; }
    .metrics b { font-variant-numeric: tabular-nums; }
    .log { max-height: 150px; overflow: auto; font: 11px/1.4 ui-monospace, Consolas, monospace;
      background: rgba(127,127,127,.08); border-radius: 6px; padding: 6px; white-space: pre-wrap; }
    .log .send { color: #10a37f; }
    .log .warn { color: #c47f17; }
    .log .err { color: #d14; }
    .activity-actions { display: flex; gap: 6px; margin-top: 8px; }
    .activity-actions { flex-wrap: wrap; }
    .activity-actions button { flex: 1 1 40%; padding: 5px 0; font: inherit; font-size: 11.5px;
      border: 1px solid #ccc; border-radius: 7px; background: ButtonFace; color: ButtonText; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Auto-Continue</h1>
  <p class="sub" id="chatScope">Loading conversation…</p>

  <div class="row">
    <label for="enabled">Enabled</label>
    <label class="switch" aria-label="Toggle Auto-Continue"><input type="checkbox" id="enabled" role="switch"><span class="slider" aria-hidden="true"></span></label>
  </div>

  <div class="field">
    <label for="message">Message</label>
    <input type="text" id="message" dir="auto" placeholder="ادامه بده">
  </div>

  <div class="row">
    <label for="delaySeconds">Delay after finish (s)</label>
    <input type="number" id="delaySeconds" min="0" max="3600" step="1">
  </div>

  <div class="row">
    <label for="maxSends">Max in a row</label>
    <input type="number" id="maxSends" min="0" max="999" step="1">
  </div>
  <div class="hint">0 = unlimited. Turn off anytime with the switch.</div>

  <div class="saved" id="saved"></div>

  <details id="activity" class="activity">
    <summary>Activity &amp; metrics</summary>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="activity-actions">
      <button type="button" id="exportDiagnostics">Export diagnostics</button>
      <button type="button" id="refresh">Refresh</button>
      <button type="button" id="copy">Copy log</button>
      <button type="button" id="clear">Clear</button>
    </div>
  </details>

  <script src="conversation-settings.js"></script>
  <script src="trace.js"></script>
  <script src="popup.js"></script>
</body>
</html>
